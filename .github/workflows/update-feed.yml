name: Generate RSS Feed

on:
  schedule:
    - cron: '*/30 * * * *' # Runs every 30 minutes
  workflow_dispatch: 
    
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache RSS-Bridge
        id: cache-rss-bridge
        uses: actions/cache@v4
        with:
          path: /tmp/rss-bridge
          key: rss-bridge-latest

      - name: Fetch RSS-Bridge if not cached
        if: steps.cache-rss-bridge.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RSS-Bridge/rss-bridge.git /tmp/rss-bridge

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, simplexml, curl, intl, dom

      - name: Fetch and Merge RSS Feeds
        run: |
          mkdir -p /tmp/raw_feeds
          mkdir -p paradigmal-bulten

          # Direct RSS Feeds
          DIRECT_FEEDS= (
          )
          
          i=0
          for url in "${DIRECT_FEEDS[@]}"; do
            echo "Fetching Direct Feed: $url"
            curl -sL "$url" > "/tmp/raw_feeds/direct_$i.xml" || true
            i=$((i+1))
          done

          # Instagram Feeds (Atom Format)
          INSTAGRAM_USERS=(
            "kampus.cadilari"
            "motorlukuryeiscileri"
            "toplumsal.ozgurluk.partisi"
            "ozgurlukcugenclik"
            "peri_hankoca"
            "doganincocuklari"
            "elyazmalaricom"
            "heryercocuk"
          )

          j=0
          for user in "${INSTAGRAM_USERS[@]}"; do
            echo "Fetching Instagram Feed: @$user"
            php /tmp/rss-bridge/index.php action=display bridge=Instagram context=Username u="$user" media_type=all format=Atom > "/tmp/raw_feeds/insta_$j.xml" || true
            j=$((j+1))
          done

          # Merge Feeds & Keep Only Last 3 Days
          php -r '
            $now = time();
            $threeDaysAgo = strtotime("-3 days");
            
            $master = new SimpleXMLElement("<?xml version=\"1.0\" encoding=\"UTF-8\"?><rss version=\"2.0\"><channel><title>Unified Feed</title><lastBuildDate>" . date(DATE_RSS) . "</lastBuildDate></channel></rss>");
            $targetDom = dom_import_simplexml($master->channel);

            foreach (glob("/tmp/raw_feeds/*.xml") as $file) {
              libxml_use_internal_errors(true);
              $xml = simplexml_load_file($file);
              if (!$xml) continue;

              $channelTitle = (string)($xml->channel->title ?? $xml->title ?? "News Source");
              $items = $xml->xpath("//item | //entry");

              if ($items) {
                foreach ($items as $item) {
                  $dateStr = (string)($item->pubDate ?? $item->published ?? $item->updated ?? "");
                  $itemTime = $dateStr ? strtotime($dateStr) : $now;

                  if ($itemTime && $itemTime < $threeDaysAgo) {
                    continue; // Skip items older than 3 days
                  }

                  $domNode = dom_import_simplexml($item);
                  $srcNode = $domNode->ownerDocument->createElement("sourceTitle", htmlspecialchars($channelTitle));
                  $domNode->appendChild($srcNode);

                  $imported = $targetDom->ownerDocument->importNode($domNode, true);
                  $targetDom->appendChild($imported);
                }
              }
            }
            $master->asXML("paradigmal-bulten/feed.xml");
          '
          
      - name: Commit Updated Feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated feed update"
          file_pattern: "paradigmal-bulten/feed.xml"
