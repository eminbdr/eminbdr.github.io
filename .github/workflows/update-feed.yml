name: Generate RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 
    
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache RSS-Bridge
        id: cache-rss-bridge
        uses: actions/cache@v4
        with:
          path: /tmp/rss-bridge
          key: rss-bridge-latest

      - name: Fetch RSS-Bridge if not cached
        if: steps.cache-rss-bridge.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/RSS-Bridge/rss-bridge.git /tmp/rss-bridge

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, simplexml, curl, intl, dom

      - name: Fetch and Merge RSS Feeds
        run: |
          mkdir -p /tmp/raw_feeds

          # ==========================================
          # 1. DIRECT RSS FEEDS (cURL)
          # Format: "URL"
          # ==========================================
          DIRECT_FEEDS=(
            "https://www.elyazmalari.com/feed"
            
            
          )
          
          i=0
          for url in "${DIRECT_FEEDS[@]}"; do
            echo "Fetching Direct Feed: $url"
            curl -sL "$url" > "/tmp/raw_feeds/direct_$i.xml" || true
            i=$((i+1))
          done

          # ==========================================
          # 2. RSS-BRIDGE FEEDS (PHP)
          # Format: "bridge_parameters"
          # ==========================================
          BRIDGE_FEEDS=(
            "action=display bridge=Instagram context=Username u=kampus.cadilari media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=motorlukuryeiscileri media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=toplumsal.ozgurluk.partisi media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=ozgurlukcugenclik media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=peri_hankoca media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=doganincocuklari media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=elyazmalaricom media_type=all format=Mrss"
            "action=display bridge=Instagram context=Username u=heryercocuk media_type=all format=Mrss"
            
            
            
            
          )
          
          j=0
          for params in "${BRIDGE_FEEDS[@]}"; do
            echo "Fetching Bridge Feed: $params"
            php /tmp/rss-bridge/index.php $params > "/tmp/raw_feeds/bridge_$j.xml" || true
            j=$((j+1))
          done

          # ==========================================
          # 3. MERGE ALL FEEDS INTO SINGLE feed.xml
          # ==========================================
          php -r '
            $master = new SimpleXMLElement("<?xml version=\"1.0\" encoding=\"UTF-8\"?><rss version=\"2.0\"><channel><title>Unified Feed</title></channel></rss>");
            $targetDom = dom_import_simplexml($master->channel);

            foreach (glob("/tmp/raw_feeds/*.xml") as $file) {
              libxml_use_internal_errors(true);
              $xml = simplexml_load_file($file);
              if (!$xml) continue;

              $channelTitle = (string)($xml->channel->title ?? $xml->title ?? "News Source");
              $items = $xml->xpath("//item | //entry");

              if ($items) {
                foreach ($items as $item) {
                  $domNode = dom_import_simplexml($item);
                  
                  // Inject feed title into item for source identification
                  $srcNode = $domNode->ownerDocument->createElement("sourceTitle", htmlspecialchars($channelTitle));
                  $domNode->appendChild($srcNode);

                  $imported = $targetDom->ownerDocument->importNode($domNode, true);
                  $targetDom->appendChild($imported);
                }
              }
            }
            $master->asXML("feed.xml");
          '
          
      - name: Commit Updated Feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated feed update"
          file_pattern: "feed.xml"
