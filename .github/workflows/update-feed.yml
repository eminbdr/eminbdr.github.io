name: Generate RSS Feed

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: 
    
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Cache RSS-Bridge
        id: cache-rss-bridge
        uses: actions/cache@v4
        with:
          path: rss-bridge
          key: rss-bridge-latest

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, simplexml, curl, intl, dom
          cache: composer
          coverage: none

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: paradigmal-bulten/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r paradigmal-bulten/requirements.txt

      - name: Execute Build Script
        run: |
          chmod +x build_feed.sh
          ./build_feed.sh

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paradigmal-bulten/feed.xml paradigmal-bulten/images/ paradigmal-bulten/feed_metadata.json
          git commit -m "Update feed and download images" || echo "No changes to commit"
          git push
