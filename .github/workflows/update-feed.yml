name: Generate RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 
    
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, simplexml, curl, intl

      - name: Fetch and Run RSS-Bridge
        run: |
          # Download RSS-Bridge to the runner
          git clone https://github.com/RSS-Bridge/rss-bridge.git /tmp/rss-bridge
          
          # 1. Fetch the direct Gazete Duvar RSS feed (Bypasses RSS-Bridge completely)
          curl -sL https://www.gazeteduvar.com.tr/export/rss > duvar_feed.xml
          
          # 2. Run Instagram Bridge (Replaces the broken YouTube command)
          php /tmp/rss-bridge/index.php action=display bridge=Instagram context=Username u=evrenselgzt media_type=all format=Mrss > public_feed.xml
          
      - name: Commit Updated Feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated feed update"
          file_pattern: "*.xml"
