name: Generate RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: 
    
jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, simplexml, curl, intl

      - name: Fetch and Run RSS-Bridge
        run: |
          # Download RSS-Bridge to the runner
          git clone https://github.com/RSS-Bridge/rss-bridge.git /tmp/rss-bridge
          
          # ==========================================
          # 1. DIRECT RSS FEEDS (cURL)
          # Format: "URL|output_filename.xml"
          # ==========================================
          DIRECT_FEEDS=(
            # "https://example.com/rss|example_feed.xml"
            "https://www.elyazmalari.com/feed/"

            
            
          )
          
          for feed in "${DIRECT_FEEDS[@]}"; do
            URL="${feed%%|*}"
            FILE="${feed##*|}"
            echo "Fetching Direct Feed: $URL -> $FILE"
            curl -sL "$URL" > "$FILE"
          done

          # ==========================================
          # 2. RSS-BRIDGE FEEDS (PHP)
          # Format: "bridge_parameters|output_filename.xml"
          # ==========================================
          BRIDGE_FEEDS=(
            "action=display bridge=Instagram context=Username u=evrenselgzt media_type=all format=Mrss|public_feed.xml"
            # "action=display bridge=Twitter context=By+username u=someone format=Mrss|twitter_feed.xml"
            
            
          )
          
          for feed in "${BRIDGE_FEEDS[@]}"; do
            PARAMS="${feed%%|*}"
            FILE="${feed##*|}"
            echo "Fetching Bridge Feed: $PARAMS -> $FILE"
            # $PARAMS is deliberately unquoted so Bash expands it into individual arguments for PHP
            php /tmp/rss-bridge/index.php $PARAMS > "$FILE"
          done
          
      - name: Commit Updated Feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated feed update"
          file_pattern: "*.xml"
