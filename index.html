<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My RSS Feed</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f2f3f5; /* Light gray background matching the app */
      color: #333;
    }
    
    h1 {
      padding: 10px;
      margin-top: 10px;
      font-size: 20px;
    }

    #news-feed {
      display: grid;
      /* Creates a 2-column layout on mobile, expanding to more on wider screens */
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 5px;
    }
    
    @media (min-width: 600px) {
       #news-feed {
         grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
       }
    }

    .article-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      background-color: #444;
      background-size: cover;
      background-position: center;
      aspect-ratio: 16 / 10; /* Card aspect ratio */
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .article-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 10px 10px 10px;
      /* Dark gradient so white text is readable over the image */
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      box-sizing: border-box;
    }

    .article-title {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      /* Truncate text to 3 lines if it gets too long */
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    
    @media (min-width: 600px) {
        .article-title { font-size: 16px; }
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #e0e0e0;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h1>Latest News</h1>
  <div id="news-feed">Loading updates from multiple sources...</div>

  <script>
    const feedUrls = ['public_feed.xml', 'duvar_feed.xml']; 

    Promise.all(feedUrls.map(url => 
      fetch(url)
        .then(response => {
          if (!response.ok) throw new Error(`Feed not found: ${url}`);
          return response.text();
        })
        .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
        .catch(error => {
          console.error("Error fetching feed:", error);
          return null; 
        })
    ))
    .then(xmlDocs => {
      let allItems = [];
      let feedHtml = "";

      xmlDocs.forEach(data => {
        if (data) {
          // Try to get the overall feed/channel title to use as the source name
          const channelTitle = data.querySelector("channel > title, feed > title")?.textContent || "News Source";
          
          const items = Array.from(data.querySelectorAll("item, entry"));
          
          // Attach the source title to each item before combining
          items.forEach(item => item.sourceTitle = channelTitle);
          allItems = allItems.concat(items);
        }
      });

      if (allItems.length === 0) {
        feedHtml = "<p style='padding: 20px;'>No articles found. Waiting for GitHub Actions to generate the feeds...</p>";
      } else {
        allItems.forEach(el => {
          const title = el.querySelector("title")?.textContent || "No title";
          const linkNode = el.querySelector("link");
          const link = linkNode?.getAttribute("href") || linkNode?.textContent || "#";
          
          // --- Attempt to extract an image URL ---
          let imageUrl = '';
          // Check common media tags
          const media = el.querySelector("[url]"); 
          if (media && media.getAttribute('url').match(/\.(jpeg|jpg|gif|png)/i)) {
             imageUrl = media.getAttribute('url');
          } else {
             // Fallback: check enclosure tag
             const enclosure = el.querySelector("enclosure[type^='image']");
             if (enclosure) {
                 imageUrl = enclosure.getAttribute('url');
             } else {
                 // Fallback: try parsing the description for an HTML <img> tag
                 const description = el.querySelector("description, summary, content")?.textContent || "";
                 const imgMatch = description.match(/<img[^>]+src=["']([^"']+)["']/i);
                 if (imgMatch) {
                     imageUrl = imgMatch[1];
                 }
             }
          }

          // --- Attempt to extract and format the date ---
          let dateStr = "";
          const pubDateNode = el.querySelector("pubDate, published, updated");
          if (pubDateNode) {
              const d = new Date(pubDateNode.textContent);
              if (!isNaN(d.getTime())) {
                  const today = new Date();
                  // If it's today, show HH:MM, otherwise show DD.MM.YYYY
                  if (d.toDateString() === today.toDateString()) {
                      dateStr = d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                  } else {
                      dateStr = `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
                  }
              }
          }

          // Build the card HTML
          feedHtml += `
            <a href="${link}" target="_blank" class="article-card" style="background-image: url('${imageUrl}');">
              <div class="article-overlay">
                <div class="article-title">${title}</div>
                <div class="article-meta">
                  <span>${el.sourceTitle}</span>
                  <span>${dateStr}</span>
                </div>
              </div>
            </a>
          `;
        });
      }

      document.getElementById("news-feed").innerHTML = feedHtml;
    });
  </script>

</body>
</html>
