<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My RSS Feed</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #333;
    }
    h1 {
      border-bottom: 2px solid #eee;
      padding-bottom: 10px;
    }
    .article {
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .article h3 {
      margin: 0 0 8px 0;
    }
    .article a {
      color: #0366d6;
      text-decoration: none;
    }
    .article a:hover {
      text-decoration: underline;
    }
    .article p {
      margin: 0;
      color: #555;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <h1>Latest News</h1>
  <div id="news-feed">Loading updates...</div>

  <script>
    // This must match the file name generated by your GitHub Action
    const feedUrl = 'public_feed.xml'; 

    fetch(feedUrl)
      .then(response => {
        if (!response.ok) throw new Error("Feed file not found");
        return response.text();
      })
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(data => {
        const items = data.querySelectorAll("item, entry");
        let feedHtml = "";

        if (items.length === 0) {
          feedHtml = "<p>No articles found. Waiting for GitHub Actions to generate the feed...</p>";
        }

        items.forEach(el => {
          const title = el.querySelector("title")?.textContent || "No title";
          
          // Handle both RSS (<link>URL</link>) and Atom (<link href="URL"/>)
          const linkNode = el.querySelector("link");
          const link = linkNode?.getAttribute("href") || linkNode?.textContent || "#";
          
          // Handle various description tags across RSS/Atom formats
          const description = el.querySelector("description, summary, content")?.textContent || "";

          feedHtml += `
            <div class="article">
              <h3><a href="${link}" target="_blank">${title}</a></h3>
              <p>${description}</p>
            </div>
          `;
        });

        document.getElementById("news-feed").innerHTML = feedHtml;
      })
      .catch(error => {
        console.error("Error fetching feed:", error);
        document.getElementById("news-feed").innerHTML = `<p style="color: red;">Error: Could not load the feed. Ensure <strong>${feedUrl}</strong> exists in your repository.</p>`;
      });
  </script>

</body>
</html>
