<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bypasses Instagram CDN hotlink restrictions -->
  <meta name="referrer" content="no-referrer">
  <title>My RSS Feed</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f2f3f5;
      color: #333;
    }

    h1 { 
      padding: 10px;
      margin: 10px 0 0 0; 
      font-size: 20px; 
    }

    #news-feed {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 5px;
    }
    
    @media (min-width: 600px) {
       #news-feed { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    }

    .article-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      background-color: #222;
      aspect-ratio: 16 / 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .card-img.loaded {
      opacity: 1;
    }

    .article-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 10px 10px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      box-sizing: border-box;
      pointer-events: none;
    }

    .article-title {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #e0e0e0;
    }
  </style>
</head>
<body>

  <h1>Latest News</h1>
  <div id="news-feed">Loading updates...</div>

  <script>
    fetch('feed.xml')
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(xmlDoc => {
        const threeDaysAgo = Date.now() - (3 * 24 * 60 * 60 * 1000);
        const items = Array.from(xmlDoc.querySelectorAll("item, entry")).filter(el => {
          const dateStr = el.querySelector("pubDate, published, updated")?.textContent;
          const t = dateStr ? new Date(dateStr).getTime() : Date.now();
          return t >= threeDaysAgo;
        });

        if (items.length === 0) {
          document.getElementById("news-feed").innerHTML = "<p style='padding: 20px;'>No recent articles in the last 3 days.</p>";
          return;
        }

        items.sort((a, b) => {
          const dateA = new Date(a.querySelector("pubDate, published, updated")?.textContent || 0);
          const dateB = new Date(b.querySelector("pubDate, published, updated")?.textContent || 0);
          return dateB - dateA;
        });

        let feedHtml = "";

        items.forEach(el => {
          const title = el.querySelector("title")?.textContent || "No title";
          const linkNode = el.querySelector("link");
          const link = linkNode?.getAttribute("href") || linkNode?.textContent || "#";
          const sourceName = el.querySelector("sourceTitle")?.textContent || "News Source";
          
          // Image extraction logic for Atom & RSS content
          let imageUrl = '';
          const contentText = el.querySelector("content, summary, description")?.textContent || "";
          const imgMatch = contentText.match(/<img[^>]+src=["']([^"']+)["']/i);
          
          if (imgMatch) {
            imageUrl = imgMatch[1];
          } else {
            const media = el.querySelector("[url]");
            if (media) imageUrl = media.getAttribute('url');
          }

          let dateStr = "";
          const pubDateNode = el.querySelector("pubDate, published, updated");
          if (pubDateNode) {
              const d = new Date(pubDateNode.textContent);
              if (!isNaN(d.getTime())) {
                  const today = new Date();
                  dateStr = (d.toDateString() === today.toDateString())
                    ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    : `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
              }
          }

          feedHtml += `
            <a href="${link}" target="_blank" class="article-card">
              ${imageUrl ? `<img src="${imageUrl}" class="card-img" onload="this.classList.add('loaded')" loading="lazy" />` : ''}
              <div class="article-overlay">
                <div class="article-title">${title}</div>
                <div class="article-meta">
                  <span>${sourceName}</span>
                  <span>${dateStr}</span>
                </div>
              </div>
            </a>
          `;
        });

        document.getElementById("news-feed").innerHTML = feedHtml;
      })
      .catch(err => {
        console.error("Error loading feed:", err);
        document.getElementById("news-feed").innerHTML = "<p style='padding: 20px;'>Unable to load feeds.</p>";
      });
  </script>
</body>
</html>
