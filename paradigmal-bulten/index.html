<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bypasses Instagram CDN hotlink restrictions -->
  <meta name="referrer" content="no-referrer">
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f2f3f5">

  <!-- iOS Specific PWA Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-title" content="Paradigma">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <title>TÖP Paradigma Bülteni</title>
  <link rel="stylesheet" href="styles.css">

</head>
<body>

  <div class="header-bar">
    <div class="header-left">
      <h1>Latest News</h1>
      <div class="update-timestamp" id="update-time">Loading...</div>
    </div>
    <button id="view-toggle-btn" class="btn-toggle" onclick="toggleView()">Card View</button>
  </div>

  <div id="news-feed">Loading updates...</div>

  <script>
    // Restore layout preference on load (defaults to List View)
    if (localStorage.getItem("preferred_view") === "card") {
      document.getElementById("news-feed").classList.add("card-view");
      document.getElementById("view-toggle-btn").innerText = "List View";
    }

    function toggleView() {
      const feed = document.getElementById("news-feed");
      const btn = document.getElementById("view-toggle-btn");
      const isCardView = feed.classList.toggle("card-view");

      btn.innerText = isCardView ? "List View" : "Card View";
      localStorage.setItem("preferred_view", isCardView ? "card" : "list");
    }

    // Load and display the timestamp
    function loadTimestamp() {
      fetch(`feed_metadata.json?v=${Date.now()}`, { cache: "no-store" })
        .then(response => {
          if (!response.ok) {
            document.getElementById("update-time").textContent = "Last updated: unknown";
            return;
          }
          return response.json();
        })
        .then(data => {
          if (data && data.last_updated_readable) {
            document.getElementById("update-time").textContent = `Last updated: ${data.last_updated_readable}`;
          }
        })
        .catch(err => {
          console.warn("Could not load timestamp:", err);
          document.getElementById("update-time").textContent = "Last updated: unknown";
        });
    }

    // Maps source titles to icon file names in your icons folder
    function getSourceIcon(sourceTitle) {
      if (!sourceTitle) return null;
      
      const text = sourceTitle.toLowerCase();
      const basePath = "icons/"; 
      
      if (text.includes("kampus") || text.includes("cadilari")) return basePath + "kampuscadilari.webp";
      if (text.includes("dogan") || text.includes("doğan")) return basePath + "doganincocuklari.png";
      if (text.includes("elyazma")) return basePath + "elyazmaları.avif";
      if (text.includes("heryercocuk") || text.includes("çocuk")) return basePath + "heryercocuk.jpeg";
      if (text.includes("kurye") || text.includes("motorlukurye")) return basePath + "motorlukuryeiscileri.jpeg";
      if (text.includes("ozgurlukcu") || text.includes("özgürlükçü") || text.includes("genclik")) return basePath + "ozgurlukcugenclik.webp";
      if (text.includes("toplumsal")) return basePath + "toplumsalozgurlukpartisi.png";
      
      return null;
    }

    let activeFilters = new Set();
    let sourceColors = {};

    // Map the EXACT feed titles to your colors
    const exactSourceColors = {
      "El Yazmaları": "#c12332",
      "elyazmalaricom - Instagram": "#c12332",
      "motorlukuryeiscileri - Instagram": "#1c1919",
      "toplumsal.ozgurluk.partisi - Instagram": "#f9c835",
      "kampus.cadilari - Instagram": "#742f8b",
      "doganincocuklari - Instagram": "#991b1b",
      "ozgurlukcugenclik - Instagram": "#0e58a1",
      "heryercocuk - Instagram": "#fde801",
      "peri_hankoca - Instagram": "#69498d",
      "default": "#555555"
    };

    // 1. Fetch metadata for timestamp
    fetch(`https://raw.githubusercontent.com/eminbdr/eminbdr.github.io/refs/heads/master/paradigmal-bulten/feed_metadata.json`, { cache: "no-store" })
      .then(res => res.ok ? res.json() : {})
      .then(metadata => {
        if (metadata.last_updated_readable) {
          document.getElementById("update-time").textContent = `Last updated: ${metadata.last_updated_readable}`;
        }

        // 2. Fetch the XML feed
        return fetch(`https://raw.githubusercontent.com/eminbdr/eminbdr.github.io/refs/heads/master/paradigmal-bulten/feed.xml`, { cache: "no-store" })
          .then(response => {
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
          })
          .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
          .then(xmlDoc => {
            const items = Array.from(xmlDoc.querySelectorAll("item, entry"));
            if (items.length === 0) {
              document.getElementById("news-feed").innerHTML = "<p style='padding: 20px;'>No articles found.</p>";
              return;
            }

            // Sort items by date
            items.sort((a, b) => {
              const dateA = new Date(a.querySelector("pubDate, published, updated")?.textContent).getTime() || 0;
              const dateB = new Date(b.querySelector("pubDate, published, updated")?.textContent).getTime() || 0;
              return dateB - dateA;
            });

            // Extract unique sources and assign colors
            const uniqueSources = [...new Set(items.map(el => el.querySelector("sourceTitle")?.textContent || "News Source"))];
            
            const filterBar = document.createElement("div");
            filterBar.className = "filter-bar";
            
            uniqueSources.forEach((source) => {
              // Exact match from the dictionary
              const color = exactSourceColors[source] || exactSourceColors["default"];
              sourceColors[source] = color;
              activeFilters.add(source); 
              
              // Clean up the name for the button display
              const displaySourceName = source.replace(" - Instagram", "").replace("@", "").trim();

              const btn = document.createElement("button");
              btn.className = "filter-btn";
              btn.style.backgroundColor = color;
              btn.innerText = displaySourceName;
              
              // Toggle logic
              btn.onclick = () => {
                if (activeFilters.has(source)) {
                  activeFilters.delete(source);
                  btn.classList.add("inactive");
                } else {
                  activeFilters.add(source);
                  btn.classList.remove("inactive");
                }
                applyFilters();
              };
              filterBar.appendChild(btn);
            });

            // Insert filter bar above the news feed
            const feedContainer = document.getElementById("news-feed");
            feedContainer.parentNode.insertBefore(filterBar, feedContainer);

            // Generate feed HTML
            let feedHtml = "";
            items.forEach(el => {
              const title = el.querySelector("title")?.textContent || "No title";
              const link = el.querySelector("link")?.getAttribute("href") || el.querySelector("link")?.textContent || "#";
              const sourceName = el.querySelector("sourceTitle")?.textContent || "News Source";
              const contentText = el.querySelector("content, summary, description")?.textContent || "";
              
              let imageUrl = '';
              const imgMatch = contentText.match(/<img[^>]+src=["']([^"']+)["']/i);
              const posterMatch = contentText.match(/poster=["']([^"']+)["']/i);
              
              if (imgMatch) imageUrl = 'https://github.com/eminbdr/eminbdr.github.io/blob/master/paradigmal-bulten/'+imgMatch[1];
              else if (posterMatch) imageUrl = 'https://github.com/eminbdr/eminbdr.github.io/blob/master/paradigmal-bulten/'+posterMatch[1];
              else {
                const media = el.querySelector("[url], enclosure[type^='image']");
                if (media) imageUrl = media.getAttribute('url') || media.getAttribute('href');
              }

              const parsedSnippetDoc = new window.DOMParser().parseFromString(contentText, "text/html");
              const snippetText = (parsedSnippetDoc.body.textContent || "").trim();

              let dateStr = "";
              const pubDateNode = el.querySelector("pubDate, published, updated");
              if (pubDateNode) {
                const d = new Date(pubDateNode.textContent);
                if (!isNaN(d.getTime())) {
                  const today = new Date();
                  dateStr = (d.toDateString() === today.toDateString())
                    ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    : `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
                }
              }

              const iconUrl = getSourceIcon(sourceName);
              const cardColor = sourceColors[sourceName];
              const displaySourceName = sourceName.replace(" - Instagram", "").replace("@", "").trim();

              // Add data-source attribute and colored left border
              feedHtml += `
                <a href="${link}" target="_blank" data-source="${sourceName}" class="article-card" style="border-left: 5px solid ${cardColor}">
                  ${iconUrl ? `<img src="${iconUrl}" class="source-logo-badge" alt="${displaySourceName}" onload="this.classList.add('loaded')" onerror="this.style.display='none'" />` : ''}
                  ${imageUrl ? `<img src="${imageUrl}?raw=true" class="card-img" onload="this.classList.add('loaded')" onerror="this.style.display='none'" loading="lazy" />` : ''}
                  <div class="article-overlay">
                    <div class="article-title">${title}</div>
                    ${snippetText ? `<div class="article-snippet">${snippetText}</div>` : ''}
                    <div class="article-meta">
                      <span style="color: ${cardColor}; font-weight: bold;">${displaySourceName}</span>
                      <span>${dateStr}</span>
                    </div>
                  </div>
                </a>
              `;
            });

            document.getElementById("news-feed").innerHTML = feedHtml;
          });
      })
      .catch(err => {
        console.error("Error loading feed:", err);
        document.getElementById("news-feed").innerHTML = `<p style='padding: 20px;'>Unable to load feeds: ${err.message}</p>`;
      });

    // Helper function to hide/show cards based on toggled buttons
    function applyFilters() {
      document.querySelectorAll(".article-card").forEach(card => {
        if (activeFilters.has(card.getAttribute("data-source"))) {
          card.style.display = ""; // Show
        } else {
          card.style.display = "none"; // Hide
        }
      });
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(registration => {
            console.log('ServiceWorker registered successfully with scope: ', registration.scope);
          })
          .catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
      });
    }
  </script>
</body>
</html>
