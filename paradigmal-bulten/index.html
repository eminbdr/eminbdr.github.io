<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My RSS Feed</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 10px;
      background-color: #f2f3f5;
      color: #333;
    }
    
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }

    h1 { margin: 0; font-size: 20px; }

    .btn-refresh {
      background: #0366d6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-refresh:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #news-feed {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
      padding: 5px;
    }
    
    @media (min-width: 600px) {
       #news-feed { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    }

    .article-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      display: block;
      background-color: #222;
      aspect-ratio: 16 / 10;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    /* Skeleton loader while image loads */
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
    }

    .card-img.loaded {
      opacity: 1;
    }

    .article-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 40px 10px 10px 10px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, rgba(0,0,0,0) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100%;
      box-sizing: border-box;
      pointer-events: none;
    }

    .article-title {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }

    .article-meta {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <h1>Latest News</h1>
    <button id="refresh-btn" class="btn-refresh" onclick="triggerWorkflow()">Trigger Refresh</button>
  </div>
  <div id="news-feed">Loading updates...</div>

  <script>
    let lastBuildTime = null;

    fetch('feed.xml')
      .then(response => response.text())
      .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
      .then(xmlDoc => {
        // Parse feed build date for 30-min cooldown
        const buildDateNode = xmlDoc.querySelector("lastBuildDate");
        if (buildDateNode) lastBuildTime = new Date(buildDateNode.textContent).getTime();
        checkCooldown();

        const threeDaysAgo = Date.now() - (3 * 24 * 60 * 60 * 1000);
        const items = Array.from(xmlDoc.querySelectorAll("item, entry")).filter(el => {
          const dateStr = el.querySelector("pubDate, published, updated")?.textContent;
          const t = dateStr ? new Date(dateStr).getTime() : Date.now();
          return t >= threeDaysAgo;
        });

        if (items.length === 0) {
          document.getElementById("news-feed").innerHTML = "<p style='padding: 20px;'>No recent articles in the last 3 days.</p>";
          return;
        }

        items.sort((a, b) => {
          const dateA = new Date(a.querySelector("pubDate, published, updated")?.textContent || 0);
          const dateB = new Date(b.querySelector("pubDate, published, updated")?.textContent || 0);
          return dateB - dateA;
        });

        let feedHtml = "";

        items.forEach(el => {
          const title = el.querySelector("title")?.textContent || "No title";
          const linkNode = el.querySelector("link");
          const link = linkNode?.getAttribute("href") || linkNode?.textContent || "#";
          const sourceName = el.querySelector("sourceTitle")?.textContent || "News Source";
          
          let imageUrl = '';
          const media = el.querySelector("[url]"); 
          if (media && media.getAttribute('url').match(/\.(jpeg|jpg|gif|png)/i)) {
             imageUrl = media.getAttribute('url');
          } else {
             const enclosure = el.querySelector("enclosure[type^='image']");
             if (enclosure) {
                 imageUrl = enclosure.getAttribute('url');
             } else {
                 const description = el.querySelector("description, summary, content")?.textContent || "";
                 const imgMatch = description.match(/<img[^>]+src=["']([^"']+)["']/i);
                 if (imgMatch) imageUrl = imgMatch[1];
             }
          }

          let dateStr = "";
          const pubDateNode = el.querySelector("pubDate, published, updated");
          if (pubDateNode) {
              const d = new Date(pubDateNode.textContent);
              if (!isNaN(d.getTime())) {
                  const today = new Date();
                  dateStr = (d.toDateString() === today.toDateString())
                    ? d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
                    : `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth()+1).padStart(2, '0')}.${d.getFullYear()}`;
              }
          }

          feedHtml += `
            <a href="${link}" target="_blank" class="article-card">
              ${imageUrl ? `<img src="${imageUrl}" class="card-img" onload="this.classList.add('loaded')" loading="lazy" />` : ''}
              <div class="article-overlay">
                <div class="article-title">${title}</div>
                <div class="article-meta">
                  <span>${sourceName}</span>
                  <span>${dateStr}</span>
                </div>
              </div>
            </a>
          `;
        });

        document.getElementById("news-feed").innerHTML = feedHtml;
      });

    function checkCooldown() {
      const btn = document.getElementById("refresh-btn");
      const lastTrigger = parseInt(localStorage.getItem('last_manual_trigger') || '0', 10);
      const effectiveLastTime = Math.max(lastBuildTime || 0, lastTrigger);
      const elapsedMinutes = (Date.now() - effectiveLastTime) / (1000 * 60);

      if (elapsedMinutes < 30) {
        const remaining = Math.ceil(30 - elapsedMinutes);
        btn.disabled = true;
        btn.innerText = `Wait ${remaining}m`;
      } else {
        btn.disabled = false;
        btn.innerText = "Trigger Refresh";
      }
    }

    async function triggerWorkflow() {
      const token = prompt("Enter GitHub Personal Access Token to trigger build:");
      if (!token) return;

      const btn = document.getElementById("refresh-btn");
      btn.disabled = true;
      btn.innerText = "Triggering...";

      try {
        const res = await fetch("https://api.github.com/repos/eminbdr/eminbdr.github.io/dispatches", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          },
          body: JSON.stringify({ event_type: "manual_trigger" })
        });

        if (res.ok) {
          localStorage.setItem('last_manual_trigger', Date.now().toString());
          alert("Workflow triggered! It will update in 1-2 minutes.");
          checkCooldown();
        } else {
          alert("Failed to trigger workflow. Check token permissions.");
          btn.disabled = false;
          btn.innerText = "Trigger Refresh";
        }
      } catch (err) {
        alert("Error triggering workflow.");
        btn.disabled = false;
        btn.innerText = "Trigger Refresh";
      }
    }

    setInterval(checkCooldown, 30000);
  </script>
</body>
</html>
